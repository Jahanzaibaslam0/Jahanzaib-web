<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="admin">
    <div id="siteHeader"></div>
    <main class="container page-layout">
      <section class="card">
        <h2>Customer Contact Results</h2>
        <p class="muted">All contact form submissions appear below.</p>
        <div id="adminContactEntries" class="entry-list"></div>
      </section>
      <section class="card">
        <h2>Customer Inquiry Results</h2>
        <p class="muted">All inquiry form submissions appear below.</p>
        <div id="adminInquiryEntries" class="entry-list"></div>
      </section>
    </main>
    <div id="siteFooter"></div>
    <script src="script.js"></script>
  </body>
</html>
